name: Test Package

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  package-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Install built wheel
        run: pip install dist/*.whl

      - name: Validate installed package
        run: |
          python -c "import textregress; print(textregress.__version__)"
          python -c "from textregress import TextRegressor; print(TextRegressor.__name__)"
          python -c "from textregress.encoders import list_available_encoders; print(list_available_encoders())"
          python -c "from textregress.models import list_available_models; print(list_available_models())"
          python -c "from textregress.losses import list_available_losses; print(list_available_losses())"
